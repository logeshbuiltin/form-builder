<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Form Builder</title>
    <base href="/" />

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=0"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="icon" type="image/x-icon" href="../lt-assets/app/app-logo-icon.png" />

    <link
      id="theme-css"
      rel="stylesheet"
      type="text/css"
      href="assets/theme/medcare/theme-light.css"
    />
    <link
      id="layout-css"
      rel="stylesheet"
      type="text/css"
      href="assets/layout/css/layout-light.css"
    />

    <link
      rel="stylesheet"
      href="https://unpkg.com/grapesjs@0.20.1/dist/css/grapes.min.css"
    />
    <!-- <link
      rel="stylesheet"
      href="https://unpkg.com/grapesjs-preset-newsletter@0.2.21/dist/grapesjs-preset-newsletter.css"
    /> -->
    <link
      href="https://unpkg.com/grapesjs-component-code-editor/dist/grapesjs-component-code-editor.min.css"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/grapesjs@0.20.1/dist/grapes.min.js"></script>
    <script src="assets/env.js"></script>
    <script src="https://unpkg.com/grapesjs-blocks-basic"></script>
    <script src="https://unpkg.com/grapesjs-preset-webpage@1.0.2"></script>
    <!-- <script src="https://unpkg.com/grapesjs-preset-newsletter@0.2.21/dist/grapesjs-preset-newsletter.min.js"></script> -->
    <script src="https://unpkg.com/grapesjs-plugin-forms@2.0.5/dist/index.js"></script>
    <script src="https://unpkg.com/grapesjs-script-editor@1.0.3/dist/grapesjs-script-editor.min.js"></script>
    <script src="https://unpkg.com/grapesjs-component-code-editor@1.0.20/dist/grapesjs-component-code-editor.min.js"></script>
    <script src="https://unpkg.com/grapesjs-blocks-table@0.0.118/dist/grapesjs-blocks-table.min.js"></script>
    <script src="https://unpkg.com/grapesjs-blocks-bootstrap4@0.2.3/dist/grapesjs-blocks-bootstrap4.min.js"></script>
  </head>
  <body>
    <app-root>
      <div class="splash-screen">
        <div class="splash-loader-container">
          <svg
            class="splash-loader"
            width="65px"
            height="65px"
            viewBox="0 0 66 66"
            xmlns="http://www.w3.org/2000/svg"
          >
            <circle
              class="splash-path"
              fill="none"
              stroke-width="6"
              stroke-linecap="round"
              cx="33"
              cy="33"
              r="30"
            ></circle>
          </svg>
        </div>
      </div>
    </app-root>
  </body>
</html>
